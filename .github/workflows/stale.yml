name: stale

# Inherited (Nashei-Studios/.github): closes PRs with conflicts for 14 days or idle for 30.
# Weekly, to spend about four minutes a month. Drafts and PRs labeled `keep` are never touched.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    permissions:
      contents: write
      pull-requests: write
    uses: Nashei-Studios/.github/.github/workflows/stale.yml@main
